# Build & deploy the help center to GitHub Pages.
#
#   push to main  ->  builds and deploys to the gh-pages ROOT   (LIVE site)
#   push to test  ->  builds and deploys to gh-pages /test/     (TEAM PREVIEW)
#
# The two deploys write disjoint paths. Concurrency groups are per-branch so a
# queued LIVE deploy can never be displaced by newer TEST pushes (GitHub keeps
# only one pending run per group); a race on the gh-pages push itself is
# resolved by the rebase-retry loop below.
#
# workflow_dispatch exists so the auto-translate workflow can trigger a deploy
# for the commits it pushes (pushes made with GITHUB_TOKEN don't fire `push`
# workflows on their own).
name: build-deploy

on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install pyyaml markdown-it-py reportlab

      - name: Build site
        run: python3 build.py

      - name: Deploy to gh-pages
        run: |
          set -e
          git config user.name  "helpcenter-bot"
          git config user.email "actions@github.com"
          git fetch origin gh-pages
          git worktree add /tmp/ghp gh-pages
          touch site/.nojekyll
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            rsync -a --delete --exclude '/test' --exclude '/CNAME' --exclude '/.git' site/ /tmp/ghp/
            MSG="deploy LIVE from main @ ${GITHUB_SHA::7}"
          else
            mkdir -p /tmp/ghp/test
            rsync -a --delete --exclude '/.git' site/ /tmp/ghp/test/
            MSG="deploy TEST from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          fi
          cd /tmp/ghp
          git add -A
          git diff --cached --quiet && { echo "nothing to deploy"; exit 0; }
          git commit -m "$MSG"
          # main and test deploys may race on the branch tip — rebase and retry
          for i in 1 2 3 4; do
            if git push origin gh-pages; then exit 0; fi
            echo "push race, retrying ($i)…"
            git pull --rebase origin gh-pages
          done
          git push origin gh-pages
